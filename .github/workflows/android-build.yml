name: Android Build & AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_API_URL: https://api.topsy.es/api
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/topsy-release.keystore
          ls -la android/app/topsy-release.keystore

      - name: Set version code from run number
        run: |
          cd android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          grep versionCode app/build.gradle

      - name: Build signed AAB
        env:
          TOPSY_KEYSTORE_PATH: topsy-release.keystore
          TOPSY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOPSY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOPSY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/ || (echo "AAB NO generado" && exit 1)
          ls -la app/build/outputs/apk/release/ || (echo "APK NO generado" && exit 1)

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopSy-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopSy-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
