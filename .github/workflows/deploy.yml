name: Deploy frontend

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend en VPS
        run: |
          ssh -i ~/.ssh/github_actions ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /home/topindev/topsy-frontend &&
            git pull origin main &&
            npm install &&
            npm run build &&
            sudo rm -rf /var/www/topsy/* &&
            sudo cp -r dist/* /var/www/topsy/ &&
            sudo systemctl reload nginx
          "